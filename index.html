<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exploding Potatoes</title>
<link rel="icon" href="assets/potato_bomb.png">
<link rel="preload" href="assets/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Press Start 2P, SIL Open Font License: see assets/fonts/OFL.txt */
  @font-face { font-family: 'Press Start 2P'; src: url(assets/fonts/PressStart2P-Regular.ttf) format('truetype'); font-display: swap; }
  :root { --board: max(240px, min(672px, calc(100vw - 24px), calc(100vh - 90px))); }
  body { margin: 0; padding: 10px; background: #0d0e14; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: 'Press Start 2P', monospace; color: #d7dbe8; }
  #hud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 24px; min-height: 36px; font-size: 14px; }
  #time { font-size: 22px; color: #ffe14c; }
  #time.low { color: #ff5a4c; }
  #lives { display: flex; gap: 4px; }
  /* first frame of the sprite sheet (facing the player), at 2x */
  #lives i { width: 32px; height: 36px; background: url(assets/farmer.png) 0 0 / 96px 144px; image-rendering: pixelated; }
  #lives i.lost { filter: grayscale(1) brightness(0.35); }
  main { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 16px; }
  .stage { position: relative; border: 2px solid #232838; }
  /* square, as large as fits the window, never above native size */
  canvas { display: block; width: var(--board); aspect-ratio: 1; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; padding: 16px; box-sizing: border-box; text-align: center; line-height: 1.7; background: rgba(14, 10, 6, 0.8); }
  [hidden] { display: none !important; }
  #legend { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 12px 32px; font-size: clamp(9px, 1.7vmin, 12px); }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figure img.s { width: 30px; } figure img.m { width: 48px; } figure img.b { width: 72px; }
  #legend p { flex-basis: 100%; color: #ff9d5c; }
  h1 { margin: 0; font-size: clamp(14px, 3.4vmin, 24px); color: #ffe14c; }
  p { margin: 0; font-size: clamp(9px, 1.7vmin, 12px); }
  form { display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 12px; color: #8cf08c; }
  input, button { font: inherit; text-align: center; border: 2px solid #d7dbe8; background: #14100c; color: #fff; padding: 10px; }
  input { width: 11em; text-transform: uppercase; }
  button { cursor: pointer; background: #7a3f22; }
  button:hover, button:focus-visible { background: #a4562e; }
  aside { width: 300px; border: 2px solid #232838; padding: 14px; box-sizing: border-box; }
  h2 { margin: 0 0 16px; font-size: 16px; text-align: center; color: #ffe14c; }
  ol { margin: 0; padding: 0; list-style: none; font-size: 12px; }
  li { display: grid; grid-template-columns: 3ch 1fr 4ch; gap: 12px; padding: 7px 4px; }
  li span:first-child, li span:last-child { text-align: right; }
  li span:nth-child(2) { overflow: hidden; white-space: pre; }
  li.empty { color: #555c70; }
  li.new { background: #2f5a2f; color: #fff; }
  aside p { margin-top: 14px; color: #7d859b; font-size: 8px; line-height: 1.8; text-align: center; }
</style>
</head>
<body>
<div id="hud">
  <span id="time" role="timer" aria-label="time left">1:00</span>
  <span id="msg">LOADING&hellip;</span>
  <span id="lives" role="img"></span>
</div>
<main>
  <div class="stage">
    <canvas id="c" width="672" height="672"></canvas>
    <div id="overlay" aria-live="polite">
      <h1 id="title">EXPLODING POTATOES</h1>
      <p id="detail"></p>
      <div id="legend">
        <figure><img class="s" src="assets/potato_bomb.png" alt="small potato"><figcaption>1 PT</figcaption></figure>
        <figure><img class="m" src="assets/potato_bomb.png" alt="medium potato"><figcaption>3 PTS</figcaption></figure>
        <figure><img class="b" src="assets/potato_bomb.png" alt="big potato"><figcaption>5 PTS</figcaption></figure>
        <p>BIGGER POTATO, BIGGER BOOM</p>
      </div>
      <form id="entry" hidden>
        <label for="name">NEW TOP 10! YOUR NAME</label>
        <input id="name" maxlength="8" autocomplete="off" spellcheck="false">
        <button>SAVE</button>
      </form>
      <p id="prompt"></p>
    </div>
  </div>
  <aside>
    <h2>TOP 10</h2>
    <ol id="ranks"></ol>
    <p>BEST SCORES IN 1 MINUTE. SAVED IN THIS BROWSER.</p>
  </aside>
</main>
<script src="scores.js"></script>
<script src="potato.js"></script>
<script>
window.__pageerr = '';
function report(tag, e) {
  window.__pageerr = (e && e.stack || String(e)) + '';
  const hint = location.protocol === 'file:'
    ? ' (serve this folder over HTTP: python3 -m http.server 8080)' : '';
  const msg = document.getElementById('msg');
  if (msg) msg.textContent = tag + ' FAIL: ' + (e && e.message || e) + hint;
}
(async () => {
  try {
    const P = await createPotato();
    window.__P = P;  // debug/test handle
    const $ = id => document.getElementById(id);
    const W = P._game_w(), H = P._game_h();
    const cv = $('c'), ctx = cv.getContext('2d', { alpha: false });
    cv.width = W; cv.height = H;
    const msg = $('msg'), clock = $('time'), lives = $('lives');
    const overlay = $('overlay'), title = $('title'), detail = $('detail'), prompt_ = $('prompt');
    const entry = $('entry'), nameBox = $('name'), ranks = $('ranks'), legend = $('legend');
    const MAX_HEARTS = 3;
    for (let i = 0; i < MAX_HEARTS; i++) lives.appendChild(document.createElement('i'));

    const calm = matchMedia('(prefers-reduced-motion: reduce)');
    const applyMotion = () => P._set_reduced_motion(calm.matches ? 1 : 0);
    calm.addEventListener('change', applyMotion);
    applyMotion();

    /* ---------------------------------------------------------- top ten */
    let storage = null;
    try { storage = window.localStorage; } catch { /* blocked: keep scores in memory */ }
    const board = createScoreboard(storage);

    function showRanks(highlight = -1) {
      const list = board.list();
      ranks.replaceChildren(...Array.from({ length: board.size }, (_, i) => {
        const row = document.createElement('li'), e = list[i];
        row.className = !e ? 'empty' : i === highlight ? 'new' : '';
        for (const text of [i + 1, e ? e.name : '---', e ? e.score : '-']) {
          const cell = document.createElement('span');
          cell.textContent = text;       // names are player input: never as HTML
          row.appendChild(cell);
        }
        return row;
      }));
    }

    /* ------------------------------------------------------------ round */
    // 'ready' (clock not started) -> 'playing' -> 'over'
    let state = 'ready', pending = null, lockedUntil = 0, entryTimer = 0;

    function showOverlay(heading, body, hint) {
      title.textContent = heading;
      detail.textContent = body;
      prompt_.textContent = hint;
      overlay.hidden = false;
    }
    function savePending() {
      if (pending === null) return;
      const rank = board.add(nameBox.value, pending);
      pending = null;
      showRanks(rank);
    }
    function newRound() {
      savePending();                         // an unsaved top score is never dropped
      clearTimeout(entryTimer);
      entry.hidden = true;
      nameBox.blur();
      releaseAll();
      P._init_game();
      state = 'ready';
      showOverlay('EXPLODING POTATOES', 'SCORE ALL YOU CAN IN 60 SECONDS',
                  'PRESS AN ARROW KEY OR WASD TO START');
      legend.hidden = false;
      showRanks();
    }
    function finish() {
      state = 'over';
      releaseAll();
      lockedUntil = performance.now() + 1000;  // players are still mashing keys
      const score = P._get_score(), count = P._get_defused();
      legend.hidden = true;
      const heading = P._get_dead() ? 'OUT OF HEARTS!' : "TIME'S UP!";
      const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : word.endsWith('O') ? 'ES' : 'S');
      const body = plural(score, 'POINT') + ' FROM ' + plural(count, 'POTATO');
      const placed = board.qualifies(score);
      showOverlay(heading, body, placed ? '' : 'PRESS R TO PLAY AGAIN');
      if (!placed) return;
      pending = score;
      nameBox.value = board.lastName();
      entryTimer = setTimeout(() => {
        entry.hidden = false;
        prompt_.textContent = 'PRESS ENTER TO SAVE';
        nameBox.focus();
        nameBox.select();
      }, 1000);
    }
    entry.addEventListener('submit', e => {
      e.preventDefault();
      savePending();
      entry.hidden = true;
      nameBox.blur();
      prompt_.textContent = 'PRESS R TO PLAY AGAIN';
    });
    addEventListener('pagehide', savePending);
    // another tab saved a score
    addEventListener('storage', () => showRanks());

    /* ------------------------------------------------------------- loop */
    // Memory never grows, so one ImageData can view it for the life of the page.
    // Calling _game_buf() is what draws any pending changes into it.
    const image = new ImageData(
      new Uint8ClampedArray(P.HEAPU8.buffer, P._game_buf(), W * H * 4), W, H);

    let shown = '';
    function hud() {
      const s = P._get_score(), h = P._get_hearts(), left = Math.ceil(P._get_time_left() / 1000);
      const low = state === 'playing' && left <= 10;
      const key = [s, h, left, low].join();
      if (key === shown) return;             // touch the DOM only on change
      shown = key;
      msg.textContent = 'SCORE ' + s;
      clock.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      clock.classList.toggle('low', low);
      [...lives.children].forEach((icon, i) => icon.classList.toggle('lost', i >= h));
      lives.setAttribute('aria-label', h + ' of ' + MAX_HEARTS + ' lives');
    }

    // One function advances and paints a frame. Only loop() schedules the next
    // animation frame, so extra calls never start a second loop.
    const tickState = { last: 0 };
    window.__tickState = tickState;
    let failed = false, timer = 0;
    function draw() {
      if (failed) return;
      try {
        const now = performance.now();
        tickState.last = now;
        if (state !== 'ready') P._frame(now);   // the clock waits for the first move
        P._game_buf();
        ctx.putImageData(image, 0, 0);
        hud();
        if (state === 'playing' && P._get_over()) finish();
      } catch (e) {
        failed = true;
        clearInterval(timer);
        report('FRAME', e);
      }
    }
    function loop() {
      draw();
      if (!failed) requestAnimationFrame(loop);
    }

    /* ------------------------------------------------------------ input */
    const MOVES = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 };
    // Movement keys currently down, newest last: the newest wins. The engine does
    // the walking, so the operating system's key repeat is ignored.
    let down = [];
    // outside a round the clock must not be touched: _move() advances it
    function steer() {
      if (state !== 'playing') return;
      P._move(performance.now(), down.length ? MOVES[down[down.length - 1]] : -1);
    }
    function releaseAll() { down = []; steer(); }

    addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;   // leave browser shortcuts alone
      if (e.target === nameBox) {                       // typing a name, not playing
        if (e.repeat) e.preventDefault();               // a key still held from the round
        return;
      }
      const k = e.key.toLowerCase();
      const move = Object.hasOwn(MOVES, k);
      if (!move && k !== 'r') return;
      e.preventDefault();
      if (failed || e.repeat) return;
      if (!move) {
        if (state !== 'over' || performance.now() >= lockedUntil) newRound();
      } else {
        if (state === 'over') return;
        if (state === 'ready') { state = 'playing'; overlay.hidden = true; }
        down = down.filter(other => other !== k).concat(k);
        steer();
      }
      draw();                    // every keystroke gets immediate visible feedback
    });
    addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (!down.includes(k)) return;
      down = down.filter(other => other !== k);
      steer();
      draw();
    });
    // a keyup can be lost when focus leaves: never leave the farmer walking
    addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

    newRound();
    // rAF is paused in occluded/background tabs; a watchdog keeps the game
    // alive (and verifiable) when it stalls. Game clock is wall-time based,
    // so tick rate only affects smoothness, not timing.
    function kick() {
      if (performance.now() - tickState.last > 150) draw();
    }
    requestAnimationFrame(loop);
    timer = setInterval(kick, 50);
    document.addEventListener('visibilitychange', kick);
    window.addEventListener('focus', kick);
    window.addEventListener('pageshow', kick);
    window.__ready = true;
  } catch (err) { report('INIT', err); }
})();
</script>
</body>
</html>
